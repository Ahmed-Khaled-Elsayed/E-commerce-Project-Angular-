<section class="auth-shell">
  <div class="auth-card">
    <div class="text-center mb-8">
      <p class="text-sm font-semibold uppercase tracking-[0.3em] text-blue-600">Welcome back</p>
      <h1 class="mt-3 text-3xl font-semibold text-slate-900">Sign in to your account</h1>
      <p class="mt-2 text-sm text-slate-600">Unlock your next favorite purchase with a smooth checkout experience.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <div *ngIf="errorMessage" class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-600">
        {{ errorMessage }}
      </div>
      <div>
        <label for="email" class="mb-2 block text-sm font-medium text-slate-700">Email address</label>
        <input
          id="email"
          formControlName="email"
          type="email"
          class="input-field"
          placeholder="you@example.com"
        />
        <small class="error-text" *ngIf="getFieldError(emailControl, 'Email') as error">{{ error }}</small>
      </div>

      <div>
        <label for="password" class="mb-2 block text-sm font-medium text-slate-700">Password</label>
        <input
          id="password"
          formControlName="password"
          type="password"
          class="input-field"
          placeholder="Enter your password"
        />
        <small class="error-text" *ngIf="getFieldError(passwordControl, 'Password') as error">{{ error }}</small>
      </div>

      <button
        type="submit"
        class="submit-btn"
        [disabled]="loginForm.invalid || isLoading"
      >
        <span *ngIf="!isLoading">Sign in</span>
        <span *ngIf="isLoading">Signing in...</span>
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-600">
      New to LuxeCart?
      <a routerLink="/auth/register" class="font-semibold text-blue-600 transition hover:text-blue-700">Create an account</a>
    </p>
  </div>
</section>
